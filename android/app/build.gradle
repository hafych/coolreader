apply plugin: 'com.android.application'

import groovy.json.JsonOutput

def releaseSigningPropertiesFile =
        rootProject.file('release-signing.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream {
        releaseSigningProperties.load(it)
    }
}
def releaseSigningValue = { String propertyName, String environmentName ->
    def projectValue = project.findProperty(propertyName)
    if (projectValue != null && !projectValue.toString().trim().isEmpty())
        return projectValue.toString()
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.trim().isEmpty())
        return environmentValue
    return releaseSigningProperties.getProperty(propertyName)
}
def releaseSigning = [
        storeFile: releaseSigningValue(
                'coolreader.release.storeFile',
                'COOLREADER_RELEASE_STORE_FILE'),
        storePassword: releaseSigningValue(
                'coolreader.release.storePassword',
                'COOLREADER_RELEASE_STORE_PASSWORD'),
        keyAlias: releaseSigningValue(
                'coolreader.release.keyAlias',
                'COOLREADER_RELEASE_KEY_ALIAS'),
        keyPassword: releaseSigningValue(
                'coolreader.release.keyPassword',
                'COOLREADER_RELEASE_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigning.values().every {
    it != null && !it.toString().trim().isEmpty()
}

android {
    namespace 'org.coolreader'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "org.coolreader"
        minSdkVersion 21
        targetSdkVersion 35
        // When new version released, version code must be incremented at least by 8
        // for compatibility with ABI versioning of split apk (see below).
        versionCode 32570
        versionName "3.2.59-1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags ""
            }
        }
    }
    sourceSets {
        main {
            setRoot('src/main')
            aidl.srcDirs = ['../../android/src']
            java.srcDirs = ['../../android/src']
            res.srcDirs = ['../../android/res']
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            // to make the bug report more readable.
            minifyEnabled false
            shrinkResources false
            debuggable false
            ndk {
                debugSymbolLevel 'FULL'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
            if (releaseSigningConfigured)
                signingConfig signingConfigs.release
        }
        release_stripped {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            if (releaseSigningConfigured)
                signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
            jniDebuggable true
            debuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
            packagingOptions{
                doNotStrip "**/*.so"
            }
        }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked"
        }
    }
    // https://developer.android.com/studio/build/configure-apk-splits
    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' //select ABIs to build APKs for
            universalApk true //generate an additional APK that contains all the ABIs
        }
    }
     // map for the version code
    project.ext.abiCodes = [
            'armeabi': 1,
            'armeabi-v7a': 2,
            'arm64-v8a': 6,
            'mips': 3,
            'mips64': 7,
            'x86': 4,
            'x86_64': 5
    ]
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // Stores the value of ext.abiCodes that is associated with the ABI for this variant.
            def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
            if (baseAbiVersionCode != null) {
                // Variant 1: small version code increment for various ABI (old behaviour)
                output.versionCodeOverride = variant.versionCode + baseAbiVersionCode
                // Variant 2: big version code increment for various ABI
                //output.versionCodeOverride = variant.versionCode + 1000000*baseAbiVersionCode
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        baseline file("lint-baseline.xml")
        checkReleaseBuilds true
        abortOnError true
    }
    compileOptions {
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

task prepareKotlinBuildScriptModel {}

tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Require a complete external release-signing configuration.'
    doLast {
        def missing = releaseSigning.findAll {
            it.value == null || it.value.toString().trim().isEmpty()
        }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Missing release signing values: ${missing.join(', ')}")
        }
        File configuredKeystore = new File(
                releaseSigning.storeFile.toString().trim())
        if (!configuredKeystore.isAbsolute()) {
            throw new GradleException(
                    'Release keystore path must be absolute and outside the repository')
        }
        File keystore = configuredKeystore
        if (!keystore.isFile())
            throw new GradleException("Release keystore not found: ${keystore}")
        def repositoryPath = rootProject.rootDir.canonicalFile.toPath()
        if (keystore.canonicalFile.toPath().startsWith(repositoryPath)) {
            throw new GradleException(
                    'Release keystore must be stored outside the repository')
        }
    }
}

tasks.register('bundleSignedRelease') {
    group = 'build'
    description = 'Build a release AAB after validating external signing inputs.'
    dependsOn 'verifyReleaseSigning'
}

gradle.projectsEvaluated {
    tasks.named('bundleSignedRelease') {
        dependsOn tasks.named('bundleRelease')
    }
    tasks.named('bundleRelease') {
        mustRunAfter tasks.named('verifyReleaseSigning')
    }
}

tasks.register('packageNativeDebugSymbols', Zip) {
    dependsOn 'bundleRelease'
    archiveFileName = 'native-debug-symbols.zip'
    destinationDirectory = file("$buildDir/outputs/native-debug-symbols/release")
    duplicatesStrategy = DuplicatesStrategy.FAIL
    includeEmptyDirs = false
    from(fileTree("$buildDir/intermediates/cxx/RelWithDebInfo") {
        include '**/obj/*/*.so'
    }) {
        eachFile { details ->
            int objectDirectory = details.path.indexOf('obj/')
            if (objectDirectory >= 0) {
                details.path = details.path.substring(objectDirectory + 4)
            }
        }
    }
}

tasks.register('writeReleaseDependencyInventory') {
    group = 'verification'
    description = 'Write the resolved release runtime dependency coordinates.'
    def outputFile = layout.buildDirectory.file(
            'reports/dependencies/release-runtime.json')
    outputs.file(outputFile)
    doLast {
        def artifacts = configurations.releaseRuntimeClasspath.incoming
                .resolutionResult.allComponents.collect { component ->
            if (!(component.id instanceof
                    org.gradle.api.artifacts.component.ModuleComponentIdentifier))
                return null
            def module = component.moduleVersion
            if (module == null || module.group == null ||
                    module.group.trim().isEmpty())
                return null
            [
                    group: module.group,
                    name: module.name,
                    version: module.version
            ]
        }.findAll { it != null }.sort { left, right ->
            "${left.group}:${left.name}:${left.version}" <=>
                    "${right.group}:${right.name}:${right.version}"
        }
        def report = [
                configuration: 'releaseRuntimeClasspath',
                components: artifacts
        ]
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n',
                'UTF-8')
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation project(path: ':genrescollection')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.xerial:sqlite-jdbc:3.53.1.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

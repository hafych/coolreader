name: CoolReader Next Release Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v<versionName> to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify tag and version
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${REQUESTED_TAG}"
          fi
          python3 tools/verify_release_version.py --tag "${release_tag}"
          python3 -c 'import json; print("version=" + json.load(open("release-version.json"))["versionName"])' >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Verify release policy documents
        run: |
          python3 tools/verify_play_release_docs.py
          python3 tools/verify_performance_budgets.py

  android:
    name: Signed Android release
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: false
      matrix:
        rebuild: [1, 2]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      COOLREADER_RELEASE_STORE_BASE64: ${{ secrets.COOLREADER_RELEASE_STORE_BASE64 }}
      COOLREADER_RELEASE_STORE_PASSWORD: ${{ secrets.COOLREADER_RELEASE_STORE_PASSWORD }}
      COOLREADER_RELEASE_KEY_ALIAS: ${{ secrets.COOLREADER_RELEASE_KEY_ALIAS }}
      COOLREADER_RELEASE_KEY_PASSWORD: ${{ secrets.COOLREADER_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set reproducible build epoch
        run: git show -s --format='SOURCE_DATE_EPOCH=%ct' >> "${GITHUB_ENV}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Require protected signing secrets
        env:
          COOLREADER_RELEASE_STORE_FILE: ${{ runner.temp }}/coolreader-release.jks
        run: |
          test -n "${COOLREADER_RELEASE_STORE_BASE64}"
          test -n "${COOLREADER_RELEASE_STORE_PASSWORD}"
          test -n "${COOLREADER_RELEASE_KEY_ALIAS}"
          test -n "${COOLREADER_RELEASE_KEY_PASSWORD}"
          printf '%s' "${COOLREADER_RELEASE_STORE_BASE64}" \
            | base64 --decode > "${COOLREADER_RELEASE_STORE_FILE}"
          chmod 600 "${COOLREADER_RELEASE_STORE_FILE}"
          printf 'COOLREADER_RELEASE_STORE_FILE=%s\n' \
            "${COOLREADER_RELEASE_STORE_FILE}" >> "${GITHUB_ENV}"

      - name: Deploy verified third-party sources
        run: ./thirdparty-deploy.sh

      - name: Verify Android release policies
        run: |
          python3 tools/verify_release_version.py --tag "${RELEASE_TAG}"
          python3 tools/verify_android_storage_policy.py
          python3 tools/verify_android_release_policy.py
          python3 tools/verify_no_telemetry.py
          python3 tools/verify_android_http_policy.py
          python3 tools/verify_android_log_privacy.py
          python3 tools/verify_parse_budget_contract.py

      - name: Build signed AAB, APK and native symbols
        run: |
          cd android
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:bundleSignedRelease \
            :app:assembleRelease \
            :app:packageNativeDebugSymbols \
            :app:writeReleaseDependencyInventory \
            --stacktrace

      - name: Generate release SBOM
        run: |
          mkdir -p release-artifacts
          python3 tools/generate_dependency_sbom.py \
            --gradle-report android/app/build/reports/dependencies/release-runtime.json \
            --output "release-artifacts/coolreader-${RELEASE_VERSION}-android.spdx.json"

      - name: Collect and verify Android artifacts
        run: |
          python3 tools/collect_android_release_artifacts.py \
            --output-dir release-artifacts
          jarsigner -verify \
            "release-artifacts/coolreader-${RELEASE_VERSION}-android.aab" \
            > "release-artifacts/coolreader-${RELEASE_VERSION}-signing.txt"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" \
            verify --print-certs \
            "release-artifacts/coolreader-${RELEASE_VERSION}-android-universal.apk" \
            >> "release-artifacts/coolreader-${RELEASE_VERSION}-signing.txt"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: candidate-android-${{ matrix.rebuild }}
          path: release-artifacts/
          if-no-files-found: error

  linux:
    name: Linux desktop archive
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rebuild: [1, 2]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt 6 and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-tools-dev qt6-tools-dev-tools zlib1g-dev libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libunibreak-dev libzstd-dev libutf8proc-dev

      - name: Deploy verified third-party sources
        run: ./thirdparty-deploy.sh

      - name: Build, test and stage Qt 6 desktop
        run: |
          python3 tools/verify_release_version.py --tag "${RELEASE_TAG}"
          cmake -S . -B build-release \
            -DGUI=QT6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-release --config Release --parallel
          ctest --test-dir build-release --output-on-failure
          DESTDIR="${GITHUB_WORKSPACE}/stage-linux" \
            cmake --install build-release --config Release

      - name: Package deterministic Linux archive
        run: |
          git show -s --format='SOURCE_DATE_EPOCH=%ct' >> "${GITHUB_ENV}"
          mkdir -p release-artifacts

      - name: Create Linux archive
        run: |
          python3 tools/package_desktop_release.py \
            --input-dir stage-linux \
            --output-dir release-artifacts \
            --platform linux-x86_64 \
            --format tar.gz

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-linux-${{ matrix.rebuild }}
          path: release-artifacts/
          if-no-files-found: error

  macos:
    name: macOS arm64 desktop archive
    needs: validate
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        rebuild: [1, 2]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt 6 and native dependencies
        run: |
          brew install qt cmake pkg-config freetype harfbuzz fribidi libunibreak zstd utf8proc libpng jpeg

      - name: Deploy verified third-party sources
        run: ./thirdparty-deploy.sh

      - name: Build, test and stage Qt 6 desktop
        run: |
          qt_prefix="$(brew --prefix qt)"
          python3 tools/verify_release_version.py --tag "${RELEASE_TAG}"
          cmake -S . -B build-release \
            -DGUI=QT6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            "-DCMAKE_PREFIX_PATH=${qt_prefix}"
          cmake --build build-release --config Release --parallel
          ctest --test-dir build-release --output-on-failure
          cmake --install build-release --config Release \
            --prefix "${GITHUB_WORKSPACE}/stage-macos/CoolReader.app"
          "${qt_prefix}/bin/macdeployqt" \
            "${GITHUB_WORKSPACE}/stage-macos/CoolReader.app"

      - name: Set reproducible archive epoch
        run: git show -s --format='SOURCE_DATE_EPOCH=%ct' >> "${GITHUB_ENV}"

      - name: Create macOS archive
        run: |
          mkdir -p release-artifacts
          python3 tools/package_desktop_release.py \
            --input-dir stage-macos \
            --output-dir release-artifacts \
            --platform macos-arm64 \
            --format zip

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-macos-${{ matrix.rebuild }}
          path: release-artifacts/
          if-no-files-found: error

  reproducibility:
    name: Compare clean release rebuilds
    needs:
      - validate
      - android
      - linux
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download candidate builds
        uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: candidate-artifacts

      - name: Require byte-identical rebuilds
        run: |
          python3 tools/compare_release_builds.py \
            --left candidate-artifacts/candidate-android-1 \
            --right candidate-artifacts/candidate-android-2 \
            --label Android
          python3 tools/compare_release_builds.py \
            --left candidate-artifacts/candidate-linux-1 \
            --right candidate-artifacts/candidate-linux-2 \
            --label Linux
          python3 tools/compare_release_builds.py \
            --left candidate-artifacts/candidate-macos-1 \
            --right candidate-artifacts/candidate-macos-2 \
            --label macOS

      - name: Assemble and verify canonical artifact set
        run: |
          mkdir release-artifacts
          cp candidate-artifacts/candidate-android-1/* release-artifacts/
          cp candidate-artifacts/candidate-linux-1/* release-artifacts/
          cp candidate-artifacts/candidate-macos-1/* release-artifacts/
          python3 tools/write_release_checksums.py \
            --directory release-artifacts
          python3 tools/verify_release_artifacts.py \
            --directory release-artifacts

      - name: Upload reproducible release set
        uses: actions/upload-artifact@v7
        with:
          name: release-verified
          path: release-artifacts/
          if-no-files-found: error

  draft-release:
    name: Verify set and create draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - reproducibility
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-verified
          path: release-artifacts

      - name: Re-verify set and generate release notes
        run: |
          python3 tools/verify_release_artifacts.py \
            --directory release-artifacts
          python3 tools/extract_release_notes.py \
            --output release-notes.md

      - name: Upload complete verified release set
        uses: actions/upload-artifact@v7
        with:
          name: release-complete
          path: release-artifacts/
          if-no-files-found: error

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            release-artifacts/* \
            --verify-tag \
            --draft \
            --title "CoolReader ${RELEASE_VERSION}" \
            --notes-file release-notes.md
